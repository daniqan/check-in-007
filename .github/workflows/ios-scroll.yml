name: iOS Scroll Smoke

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ios-scroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-scroll:
    name: iPadOS touch scroll
    runs-on: [self-hosted, macOS, ios-touch]
    timeout-minutes: 20
    env:
      CHECKIN007_IOS_SCROLL_REQUIRED: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 24 (pinned via .nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build kiosk
        run: npm run build

      - name: iOS touch-scroll smoke
        run: npm run test:ios-scroll

      - name: Upload iOS scroll evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-scroll-evidence
          path: |
            test-results/ios-scroll-result.json
            test-results/ios-scroll.xcresult
          if-no-files-found: ignore
